<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MotorGenesis · 有机电机的形态发生</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>MotorGenesis</h1>
      <p class="tag">有机电机 · 形态发生实时观察台</p>
    </header>

    <section class="panel">
      <label for="runSelect">运行实例</label>
      <select id="runSelect"><option value="">加载中…</option></select>
    </section>

    <section class="panel">
      <label>形态发生时间轴</label>
      <div class="timeline">
        <button id="prevBtn" title="上一步">‹</button>
        <input id="stepRange" type="range" min="0" max="0" value="0" />
        <button id="nextBtn" title="下一步">›</button>
      </div>
      <div class="step-info"><span id="stepLabel">—</span></div>
      <label class="live-toggle">
        <input id="liveToggle" type="checkbox" /> 实时跟随最新生长
      </label>
      <label class="live-toggle" title="仅显示打印定子（移除转子/磁钢），用于与打印定子参考图对比">
        <input id="statorViewToggle" type="checkbox" /> 定子视图 Stator view
      </label>
      <button id="downloadStl" class="download-btn" title="下载当前步骤 STL">⬇ 下载 STL</button>
    </section>

    <section class="panel">
      <label>材料显示</label>
      <div id="materialToggles" class="toggles"></div>
      <label>等值面阈值 <span id="levelVal">0.35</span></label>
      <input id="levelRange" type="range" min="0.15" max="0.65" step="0.05" value="0.35" />
    </section>

    <section class="panel">
      <label>物理场切片</label>
      <select id="sliceField">
        <option value="temperature">温度 T [°C]</option>
        <option value="Bmag">磁通密度 |B| [T]</option>
        <option value="Jmag">电流密度 |J|</option>
        <option value="rho_iron">铁密度</option>
        <option value="rho_copper">铜密度</option>
        <option value="rho_pm">磁钢密度</option>
      </select>
      <div class="slice-axes">
        <button data-axis="0">X 切</button>
        <button data-axis="1" class="active">Y 切</button>
        <button data-axis="2" class="active main">Z 切</button>
      </div>
      <input id="sliceIndex" type="range" min="0" max="0" value="0" />
      <canvas id="sliceCanvas" width="240" height="240"></canvas>
    </section>

    <section class="panel metrics">
      <label>当前指标</label>
      <dl id="metricList"></dl>
    </section>

    <section class="panel" id="startupPanel" style="display:none">
      <label>启动验证 (多初始角)</label>
      <div class="step-info"><span id="startupVerdict">—</span></div>
      <div id="startupAngles" class="startup-angles"></div>
      <div id="startupVerdicts" class="verdicts"></div>
    </section>

    <section class="panel" id="simPanel">
      <label>通电仿真</label>
      <div class="sim-params">
        <label>控制模式
          <select id="simControlMode">
            <option value="open_loop">开环电压</option>
            <option value="current_control" selected>电流闭环 PI</option>
          </select>
        </label>
        <label id="simIqRefRow">q轴电流 [A] <input id="simIqRef" type="number" value="8" step="1" /></label>
        <label>电压 [V] <input id="simVoltage" type="number" value="24" step="1" /></label>
        <label>电流上限 [A] <input id="simCurrentLimit" type="number" value="50" step="5" /></label>
        <label>初始角 [°] <input id="simInitialAngle" type="number" value="0" step="15" /></label>
        <label>负载 [Nm] <input id="simLoadTorque" type="number" value="0.005" step="0.001" /></label>
        <label>断电时刻 [ms] <input id="simPowerOff" type="number" value="" placeholder="不断电" step="10" /></label>
        <label>步数 <input id="simSteps" type="number" value="4000" step="500" /></label>
      </div>
      <div class="sim-controls">
        <button id="simRunBtn" class="sim-btn">⚡ 通电运行</button>
        <button id="simPlayBtn" class="sim-btn" disabled>▶ 播放</button>
        <button id="simResetBtn" class="sim-btn" disabled>↺ 重置</button>
      </div>
      <div id="simStatus" class="sim-status">未运行</div>
      <div class="sim-playback">
        <input id="simTimeSlider" type="range" min="0" max="0" value="0" disabled />
        <span id="simTimeLabel">—</span>
      </div>
    </section>

    <section class="panel" id="curvesPanel" style="display:none">
      <label>仿真曲线</label>
      <canvas id="curvesCanvas" width="280" height="200"></canvas>
    </section>

    <footer>
      <span id="statusLine" class="status">就绪</span>
    </footer>
  </aside>

  <main id="viewport">
    <div id="loadOverlay" class="overlay">
      <div class="spinner"></div>
      <p id="loadText">初始化…</p>
    </div>
    <div id="hud" class="hud">
      <span id="fpsHud">—</span>
    </div>
  </main>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three.module.js",
    "three/addons/": "/static/vendor/"
  }
}
</script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
