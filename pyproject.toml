[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-genesis"
version = "0.2.0"
description = "Differentiable free-topology permanent-magnet motor design"
requires-python = ">=3.9"
dependencies = [
  "jax>=0.4.30",
  "numpy>=1.26",
  "optax>=0.2.3",
  "matplotlib>=3.8",
  "scipy>=1.12",
  "scikit-image>=0.23",
  "trimesh>=4.4",
]

[project.optional-dependencies]
test = ["pytest>=8.2"]
morphogenesis = ["pyvista>=0.44"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["organic_motor*"]
